name: Build Candy Crush AutoBot APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        run: |
          echo "=== TẠO GRADLE WRAPPER VÀ BIÊN DỊCH APK ==="
          gradle wrapper --gradle-version 8.5
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Collect and Rename APK
        run: |
          mkdir -p apk_output
          find app/build/outputs/apk/debug -name "*.apk" -type f -exec cp {} apk_output/CandyCrush_AutoBot.apk \;
          echo "File APK đã được tạo thành công:"
          ls -lh apk_output/

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CandyCrush_AutoBot_APK
          path: apk_output/CandyCrush_AutoBot.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          tag_name: release-v1.0.${{ github.run_number }}
          name: "Candy Crush AutoBot APK (v1.0.${{ github.run_number }})"
          body: |
            🍬 **CANDY CRUSH SAGABOT - BẢN APK CÀI ĐẶT TRỰC TIẾP TRÊN ĐIỆN THOẠI**
            
            - Tối ưu cho Samsung Galaxy Note 10+ và các máy Android.
            - Nút Home ảo (Floating AssistiveTouch) tròn trên màn hình game.
            - Chạm 1 lần để TỰ ĐỘNG CHƠI (Tự tìm combo Color Bomb, Striped Candy, cascade).
            - Chạm lại để Tạm dừng bất kỳ lúc nào.
            - Hoàn toàn độc lập, không cần cắm cáp hay kết nối máy tính!
          files: apk_output/CandyCrush_AutoBot.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
